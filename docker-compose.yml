services:
  app:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - ./storage:/var/www/storage
      - ./public/uploads:/var/www/public/uploads
      - ./public/img:/var/www/public/img
      - ./public/assets:/var/www/public/assets
      - ./public/files:/var/www/public/files
      - ./app:/var/www/app
    environment:
      - BASE_PATH=
